# Non-secret Cloud Run environment variables for WebSearch_GO.
# Load with:
#   gcloud run services update websearch-go --region "$REGION" --env-vars-file deploy/cloud-run.env.yaml
#
# Bind GOOGLE_API_KEY, SERPER_API_KEY, and REDIS_URL from Secret Manager
# separately; do not add secret values to this file.

PORT: "8080"
GEMINI_MODEL: "gemini-2.5-flash-lite"
GOOGLE_GENAI_USE_VERTEXAI: "true"
GOOGLE_CLOUD_PROJECT: "gen-lang-client-0665888431"
GOOGLE_CLOUD_LOCATION: "asia-south1"
GCP_REGION: "asia-south1"

CACHE_BACKEND: "redis"
REDIS_KEY_PREFIX: "websearch-go:"
GCS_CACHE_BUCKET: "crystal-crm-store"
GCS_CACHE_PREFIX: "WebSearch_GO/cache/"
OUTPUT_BUCKET: "crystal-crm-store"
OUTPUT_PREFIX: "WebSearch_GO/"
OUTPUT_FORMATS: "md,pdf"

ENABLE_BROWSER_FALLBACK: "false"
ALLOW_BROWSER_TOGGLE: "false"
ALLOW_PROFILE_SCRAPING: "false"
HARD_URL_HANDLER: "true"
HARD_URLS_PER_RUN: "2"
HARD_URL_BUDGET_SECONDS: "0"

RESEARCH_TIMEOUT_SECONDS: "180"
BROWSER_RESEARCH_TIMEOUT_SECONDS: "300"
MAX_SCRAPES_PER_RUN: "10"
MAX_SEARCH_RESULTS: "12"
MAX_AGENT_STEPS: "10"
VALIDATE_EVIDENCE: "true"
ENTITY_GATE_MODE: "enforce"
VALIDATION_LOOKUPS_PER_RUN: "10"
VALIDATION_STALE_AFTER_MONTHS: "36"
VALIDATION_RECENT_WITHIN_MONTHS: "18"

SCRAPE_CONCURRENCY: "4"
SCRAPE_HOST_RATE_PER_SEC: "2"
SCRAPE_HOST_BURST: "3"
SCRAPE_HOST_CONCURRENCY: "2"
SCRAPE_REVALIDATE_AFTER_SECONDS: "86400"
SCRAPE_MAX_RETRY_AFTER_SECONDS: "5"
DOCUMENT_EXTRACT_TIMEOUT_SECONDS: "60"
