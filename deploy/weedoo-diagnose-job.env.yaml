# Cloud Run Job env vars for the weedoo-diagnose probe. Inline
# --set-env-vars with comma-separated pairs gets mangled by this gcloud
# version (it produced DIAGNOSE_MODE="inertia NODE_USE_ENV_PROXY=1"), so the
# job takes its env from this file instead:
#   gcloud run jobs update weedoo-diagnose --region "$REGION" \
#     --env-vars-file deploy/weedoo-diagnose-job.env.yaml \
#     --set-secrets "HTTPS_PROXY=residential_proxy_url:latest"
DIAGNOSE_MODE: "inertia"
NODE_USE_ENV_PROXY: "1"